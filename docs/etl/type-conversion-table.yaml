# Canonical SQL Server → Qlik Replicate → Snowflake type conversion table.
# Normative. The CREATE TABLE spec in sqlserver-to-snowflake-create-table-spec.md
# governs how an AI Agent MUST apply these rows.
#
# Mapping chain (customer ①):
#   SQL Server type → Qlik Replicate internal type → Snowflake type
# Sources:
#   - Qlik Replicate May 2026: SQL Server source data types
#   - Qlik Replicate May 2026: Snowflake target data types
# If 保全 DDL compare (customer ②) disagrees with a row, record the fact and
# keep the approved override. Do not silently pick a third type.
#
# table_action:
#   map  - emit Snowflake type
#   stop - fail table generation (unmapped / unsupported)
# view_action:
#   infer    - do not declare type on CREATE VIEW
#   fallback - optional VARCHAR/VARIANT only for views, never for tables

version: 1
mapping_authority: qlik_replicate
qlik_doc_version: May2026
snowflake_integer_rule: "Qlik: INT/INTEGER/BIGINT/SMALLINT/TINYINT/BYTEINT always NUMBER(38,0) on Snowflake"

priority:
  - explicit_override        # approved exception in overrides[]
  - hozen_observed_ddl       # 保全 SQL Server vs Snowflake DDL compare
  - this_table               # default Qlik-derived mapping
  - unmapped_stop

string_length_rules:
  string:
    # Replicate STRING → Snowflake
    - when: "1 <= length_bytes <= 16777216"
      snowflake: "VARCHAR(length_bytes)"
    - when: "16777217 <= length_bytes <= 2147483647"
      snowflake: "VARCHAR(16777216)"
  wstring:
    # Replicate WSTRING → Snowflake (Unicode). Snowflake VARCHAR is Unicode.
    # Default CREATE TABLE uses character length n from NVARCHAR(n)/NCHAR(n).
    # If 保全 shows a different byte length, 保全 wins.
    - when: "1 <= length_bytes <= 21845"
      snowflake: "VARCHAR(length_bytes)"
    - when: "21846 <= length_bytes <= 2147483647"
      snowflake: "VARCHAR(16777216)"
  bytes:
    - when: "1 <= length_bytes <= 8388608"
      snowflake: "BINARY(length_bytes)"
    - when: "8388609 <= length_bytes <= 2147483647"
      snowflake: "BINARY(8388608)"
  max_varchar: "VARCHAR(16777216)"
  max_binary: "BINARY(8388608)"

types:
  - sqlserver: bigint
    qlik: INT8
    snowflake: NUMBER(38,0)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden
    notes: "Qlik integer types are NUMBER(38,0) on Snowflake."

  - sqlserver: int
    qlik: INT4
    snowflake: NUMBER(38,0)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: smallint
    qlik: INT2
    snowflake: NUMBER(38,0)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: tinyint
    qlik: UINT1
    snowflake: NUMBER(38,0)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden
    notes: "Qlik UINT1 → BYTEINT on some targets; on Snowflake integers are NUMBER(38,0)."

  - sqlserver: bit
    qlik: BOOL
    snowflake: BOOLEAN
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: decimal
    qlik: NUMERIC
    snowflake: "NUMBER(p,s)"
    precision_scale_rule: "Copy SQL Server (p,s). If p > 38 → STOP (do not silently TEXT)."
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik: scale 0..37 → NUMBER(p,s); scale 38..127 → NUMBER(length). Precision > 38 is not a silent fallback on tables."

  - sqlserver: numeric
    qlik: NUMERIC
    snowflake: "NUMBER(p,s)"
    precision_scale_rule: "Same as decimal."
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden

  - sqlserver: money
    qlik: "NUMERIC(19,4)"
    snowflake: NUMBER(19,4)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Currency symbol is not stored. Rounding must match 19,4."

  - sqlserver: smallmoney
    qlik: "NUMERIC(10,4)"
    snowflake: NUMBER(10,4)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden

  - sqlserver: real
    qlik: REAL4
    snowflake: FLOAT
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik REAL4 → FLOAT4. Snowflake FLOAT4 is an alias of FLOAT."

  - sqlserver: float
    qlik: REAL8
    snowflake: FLOAT
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden

  - sqlserver: date
    qlik: DATE
    snowflake: DATE
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: datetime
    qlik: DATETIME
    snowflake: TIMESTAMP_NTZ(3)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik DATETIME → TIMESTAMP(precision). Use NTZ. SQL Server DATETIME ~ 3 fractional digits."

  - sqlserver: datetime2
    qlik: DATETIME
    snowflake: "TIMESTAMP_NTZ(n)"
    precision_scale_rule: "n = SQL Server fractional seconds precision 0..7. Snowflake allows 0..9."
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden

  - sqlserver: smalldatetime
    qlik: DATETIME
    snowflake: TIMESTAMP_NTZ(0)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden

  - sqlserver: time
    qlik: "STRING(16)"
    snowflake: VARCHAR(16)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik maps TIME to STRING(16), not Snowflake TIME. CREATE TABLE MUST follow Qlik so apply does not fail."

  - sqlserver: datetimeoffset
    qlik: STRING
    snowflake: VARCHAR(34)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik maps DATETIMEOFFSET to STRING, not TIMESTAMP_TZ. Default VARCHAR(34). Override only with approval."

  - sqlserver: char
    qlik: STRING
    snowflake: "VARCHAR(n)"
    length_rule: "n = char length. CHAR(n) becomes VARCHAR(n) (Snowflake CHAR is also allowed; Qlik target is VARCHAR)."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: "widen_varchar_allowed"

  - sqlserver: varchar
    qlik: STRING
    snowflake: "VARCHAR(n)"
    length_rule: "n = varchar length. varchar(max) is a different row."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: "widen_varchar_allowed"

  - sqlserver: varchar_max
    sqlserver_aliases: ["varchar(max)", "text"]
    qlik: CLOB
    snowflake: VARCHAR(16777216)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Requires CLOB enabled in Qlik task. CDC/LOB update behavior differs from in-row types."

  - sqlserver: nchar
    qlik: WSTRING
    snowflake: "VARCHAR(n)"
    length_rule: "n = nchar character length. Snowflake VARCHAR is Unicode."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: "widen_varchar_allowed"

  - sqlserver: nvarchar
    qlik: WSTRING
    snowflake: "VARCHAR(n)"
    length_rule: "n = nvarchar character length. nvarchar(max) is a different row."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: "widen_varchar_allowed"

  - sqlserver: nvarchar_max
    sqlserver_aliases: ["nvarchar(max)", "ntext"]
    qlik: NCLOB
    snowflake: VARCHAR(16777216)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Requires NCLOB enabled in Qlik task. Qlik NCLOB → NVARCHAR(16777216); Snowflake NVARCHAR is VARCHAR."

  - sqlserver: binary
    qlik: BYTES
    snowflake: "BINARY(n)"
    length_rule: "n = binary length in bytes, cap 8388608."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: varbinary
    qlik: BYTES
    snowflake: "BINARY(n)"
    length_rule: "n = varbinary length in bytes, cap 8388608. varbinary(max) is a different row."
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: varbinary_max
    sqlserver_aliases: ["varbinary(max)", "image"]
    qlik: BLOB
    snowflake: BINARY(8388608)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Requires BLOB enabled in Qlik task."

  - sqlserver: timestamp
    sqlserver_aliases: ["rowversion"]
    qlik: BYTES
    snowflake: BINARY(8)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "NOT a datetime. SQL Server TIMESTAMP/ROWVERSION is binary(8)."

  - sqlserver: uniqueidentifier
    qlik: STRING
    snowflake: VARCHAR(36)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden

  - sqlserver: xml
    qlik: CLOB
    snowflake: VARCHAR(16777216)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik: CLOB; JSON/XML subtype may become VARIANT. Default VARCHAR for table stability. VARIANT only with approval."

  - sqlserver: json
    qlik: "NCLOB (JSON subtype)"
    snowflake: VARIANT
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik STRING/WSTRING/NCLOB with JSON subtype → VARIANT."

  - sqlserver: hierarchyid
    qlik: "VARCHAR(x)"
    snowflake: VARCHAR(4000)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik length x is not fixed. Default VARCHAR(4000). Override from 保全 if observed."

  - sqlserver: geometry
    qlik: NCLOB
    snowflake: VARCHAR(16777216)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Qlik NCLOB (text). Do not use Snowflake GEOMETRY unless approved override. Values may not round-trip."

  - sqlserver: geography
    qlik: NCLOB
    snowflake: VARCHAR(16777216)
    table_action: map
    view_action: infer
    confidence: yellow
    cdc_type_change: forbidden
    notes: "Same as geometry. Do not auto-map to Snowflake GEOGRAPHY (WKT/WKB contract differs)."

  - sqlserver: sysname
    qlik: WSTRING
    snowflake: VARCHAR(128)
    table_action: map
    view_action: infer
    confidence: green
    cdc_type_change: forbidden
    notes: "SQL Server SYSNAME = NVARCHAR(128) NOT NULL. Preserve NOT NULL."

  # --- STOP types: no CREATE TABLE emission ---

  - sqlserver: sql_variant
    qlik: unsupported
    snowflake: null
    table_action: stop
    view_action: fallback
    fallback_view_type: VARIANT
    confidence: red
    error_code: UNMAPPED_TYPE
    notes: "Qlik: unsupported. Tables MUST stop. Do not guess VARIANT on tables."

  - sqlserver: cursor
    qlik: unsupported
    snowflake: null
    table_action: stop
    view_action: infer
    confidence: red
    error_code: UNMAPPED_TYPE

  - sqlserver: table
    qlik: unsupported
    snowflake: null
    table_action: stop
    view_action: infer
    confidence: red
    error_code: UNMAPPED_TYPE
    notes: "Table-valued type, not a column type for Raw CDC tables."

  - sqlserver: sql_variant_udt_unknown
    qlik: null
    snowflake: null
    table_action: stop
    view_action: fallback
    fallback_view_type: VARCHAR(16777216)
    confidence: red
    error_code: UNMAPPED_TYPE
    notes: "Catch-all. Any SQL Server type not listed MUST stop for tables."

udt_rule:
  description: "User-defined types are mapped by base type (Qlik). Resolve sys.types.system_type_id / base type, then apply this table. If base type cannot be resolved → STOP."

overrides: []
  # Example:
  # - source_schema: dbo
  #   source_table: orders
  #   source_column: created_at
  #   sqlserver: datetimeoffset
  #   snowflake: TIMESTAMP_TZ(7)
  #   approved_by: TBD
  #   reason: "System consumer needs timezone"

cdc_metadata_columns:
  enabled_by_config: include_cdc_metadata_columns
  default_enabled: false
  notes: "Only emit if config says Qlik/ETL apply requires header columns. Names MUST come from config, not invented."
  columns: []
  # Fill from actual Qlik task / apply settings, e.g.:
  # - name: header__change_seq
  #   snowflake: VARCHAR(50)
  #   null: false
